# Local stand-in for a deployed golden POC (§10.2): MongoDB + seed + backend + frontend behind nginx on :8088.
# Usage: docker compose -f fixtures/golden/docker-compose.yml up --build   → http://localhost:8088
services:
  mongo:
    image: mongo:8.0
    ports: ["27017:27017"]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"], interval: 5s, timeout: 5s, retries: 20 }
  seed:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./code/v001/seed:/app"]
    environment: { MONGODB_URI: "mongodb://mongo:27017/poc_golden", SEED_MAX_DOCS: "10000" }
    command: sh -c "npm ci --omit=dev && node seed.js"
    depends_on: { mongo: { condition: service_healthy } }
  backend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./code/v001/backend:/app"]
    environment: { MONGODB_URI: "mongodb://mongo:27017/poc_golden", PORT: "8080" }
    command: sh -c "npm ci && npm run build && node dist/server.js"
    depends_on: { seed: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"], interval: 5s, timeout: 5s, retries: 30 }
  frontend-build:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./code/v001/frontend:/app"]
    environment: { VITE_API_BASE_URL: "/api" }
    command: sh -c "npm ci && npm run build"
  web:
    image: nginx:1.27-alpine
    ports: ["8088:80"]
    volumes: ["./code/v001/frontend/dist:/usr/share/nginx/html:ro", "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      backend: { condition: service_healthy }
      frontend-build: { condition: service_completed_successfully }
