# Same shape the Deploy Agent writes on EC2 (§6.7 step 10, F15): / → static dist, /api → backend on 8080.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://backend:8080/api/; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}
