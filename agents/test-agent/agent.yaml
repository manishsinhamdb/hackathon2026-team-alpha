# Test Agent — POC Builder Stage 4 (Spec §6.8). Called by the Deploy Agent and Chat Agent over A2A
# with an AgentEnvelope JSON body; runs Playwright end-to-end tests on the POC's EC2 instance.
name: test-agent
entrypoint: agent_test_agent.main:app
framework: langgraph
features:
    durable_workflow: true
    memory: false
# All test orchestration runs in the Tool Pod; the Agent Pod holds no tools.
sandboxes:
    agent:
        secrets: ["*"]
        tools: []
    tool:
        secrets: ["*"]
        tools:
            - test_start_run
            - test_load_context
            - test_generate_plan
            - test_run_api_smoke
            - test_run_browser
            - test_write_report
version: 0.1.0
network:
    egress_mode: allow_all
a2a:
    enabled: true
    # Fill with the Deploy Agent's and Chat Agent's workspace ids after `agentic init` (environment-specific, see docs/05_deploying.md).
    allowed_callers: []
    skills:
        - name: e2e-tests
          description: "Validates a deployed POC end-to-end with Playwright on the POC's own EC2 instance, generating test plans from spec user stories and producing a structured report with per-failure component attribution. Input and output are AgentEnvelope JSON (tool run_e2e)."
          example_input: '{"request": {"poc_id": "poc_...", "run_id": "run_...", "task_id": "task_...", "caller": "deploy_agent", "agent": "test_agent", "tool": "run_e2e", "params": {"deployment_run_id": "run_...", "scope": "all"}}}'
    input_modes: ["text/plain"]
    output_modes: ["text/plain"]
