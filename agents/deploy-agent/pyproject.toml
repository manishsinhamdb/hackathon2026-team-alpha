[project]
name = "deploy-agent"
version = "0.1.0"
description = "POC Builder Deploy Agent (Stage 3-5) for the MongoDB Agentic AI Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "agent-engine-runner-shared[mongodb,tracing]",
    "agent-engine-sdk-langgraph",
    "protobuf>=6.33.6,<7",
    "python-dotenv>=1.0.0",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "langchain>=1.0.0",
    "langchain-anthropic>=1.4.0",
    "boto3>=1.34",
    "pymongo>=4.6",
    "requests>=2.32",
    "poc-contracts",
    "poc-shared-tools",
    "poc-infra-tools",
]

[project.scripts]
deploy-agent = "agent_deploy_agent.main:main"

[tool.uv.sources]
poc-contracts = { path = "vendor/poc_contracts", editable = true }
poc-shared-tools = { path = "vendor/shared_tools", editable = true }
poc-infra-tools = { path = "vendor/infra_tools", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_deploy_agent"]

[dependency-groups]
dev = ["pyright>=1.1.390", "ruff>=0.1.0", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
