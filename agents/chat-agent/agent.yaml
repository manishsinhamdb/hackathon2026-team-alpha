# Chat Agent — POC Builder user-facing front door (Spec §6.1). Drives draft, code, deploy and test
# stages through the other agents; stores every message in conversations.
name: chat-agent
entrypoint: agent_chat_agent.main:app
framework: langgraph
features:
    durable_workflow: true
    memory: true
# All coordination runs in the Agent Pod; the Tool Pod holds no tools yet.
sandboxes:
    agent:
        secrets: ["*"]
        tools: []
    tool:
        secrets: ["*"]
        tools: []
version: 0.1.0
network:
    egress_mode: allow_all
a2a:
    enabled: true
    # Fill with the calling workspace id after `agentic init` (environment-specific, see docs/05_deploying.md).
    allowed_callers: []
    skills:
        - name: chat
          description: "User-facing front door for POC Builder; drives draft, code, deploy and test stages through the other agents."
          example_input: '{"request": {"poc_id": "poc_...", "run_id": "run_...", "task_id": "task_...", "caller": "web_ui", "agent": "chat_agent", "tool": "draft_spec", "params": {"poc_id": "poc_..."}}}'
    input_modes: ["text/plain"]
    output_modes: ["text/plain"]
