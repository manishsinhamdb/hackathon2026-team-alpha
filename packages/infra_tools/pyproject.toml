[project]
name = "poc-infra-tools"
version = "0.1.0"
description = "EC2 / SSM / Atlas provisioning tools for the POC Builder Deploy Agent (Spec §7.4–7.6)"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34", "pymongo>=4.6", "requests>=2.32", "poc-contracts", "poc-shared-tools"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.uv.sources]
poc-contracts = { path = "../poc_contracts", editable = true }
poc-shared-tools = { path = "../shared_tools", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poc_infra_tools"]
