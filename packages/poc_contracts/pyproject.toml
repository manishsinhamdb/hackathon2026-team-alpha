[project]
name = "poc-contracts"
version = "0.1.1"
description = "Frozen cross-agent contracts (JSON schemas, AgentEnvelope, IDs, fakes) for POC Builder"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poc_contracts"]
