  #   path: agents/data-seeding-agent
  # - name: api-agent
  #   path: agents/api-agent
  # - name: frontend-agent
  #   path: agents/frontend-agent
  # - name: deploy-agent
  #   path: agents/deploy-agent
  # - name: test-agent
  #   path: agents/test-agent
  - name: reference-chat-agent
    path: agents/reference-chat-agent
  - name: atlas-assistant
    path: agents/atlas-assistant
