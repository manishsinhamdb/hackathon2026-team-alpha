# Monorepo root file.
# The CLI treats this repository as a monorepo because this file has an `agents`
# key instead of an `entrypoint` key. Every agent that should take part in the
# shared local stack must be listed here, with the path to its workspace.
#
# Adding a folder under agents/ does nothing on its own: add the entry below in
# the same pull request. scripts/check_agents_map.py enforces this in CI.
#
# Uncomment your row when your workspace exists.

agents:
